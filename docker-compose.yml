version: '3'
services:
  compagnidiviaggiocercasi-postgres:
    container_name: compagnidiviaggiocercasi-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - compagnidiviaggiocercasi-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  compagnidiviaggiocercasi-data:
